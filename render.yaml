services:
  - type: web
    name: simda-website
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_BOOKS
        sync: false
      - key: NOTION_DB_PROJECTS
        sync: false
      - key: NOTION_DB_PHOTOS
        sync: false
      - key: NOTION_DB_SOUND_ALBUMS
        sync: false
      - key: NOTION_DB_GOODS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Cloudflare R2 (관리자 페이지 사진 업로드용 스토리지)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
